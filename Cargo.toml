[workspace]
members = [
    "crates/coords",
    "crates/det_rng",
    "crates/worldgen",
    "crates/game",
    "tools/mapdump",
    "tools/mapbench",
    "tools/maprender",
    "tools/maptest",
    "tools/maptune",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Kristoffer"]
license = "TBD"

[workspace.dependencies]
# Workspace crates
coords  = { path = "crates/coords" }
det-rng = { path = "crates/det_rng" }
worldgen = { path = "crates/worldgen" }

# External dependencies — versions pinned here, referenced in member crates
# with `dependency = { workspace = true }`
bevy     = { version = "0.18", default-features = false }
anyhow   = "1"
thiserror = "2"
tracing  = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand     = "0.10.1"
rand_chacha = "0.10.0"
rand_core = "0.10.0"
serde    = { version = "1", features = ["derive"] }
ron      = "0.12.1"
rayon    = "1"
proptest = "1"
clap = { version = "4", features = ["derive"] }
blake3 = "1"


[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
dead_code       = "deny"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# module_name_repetitions fires on idiomatic types like map::MapData.
# Common and acceptable; the repetition is intentional.
module_name_repetitions = "allow"
# must_use_candidate wants #[must_use] on many getter-like functions.
# Too noisy at this stage; revisit when API stabilises.
must_use_candidate = "allow"
